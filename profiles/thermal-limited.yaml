# T-027 - situational profile. Provenance is mandatory: every claimed number names the
# task that measured it. 'not measured' is an acceptable value; an invented one is not.
schema: 1
kind: profile
name: thermal-limited
description: "Fanless or on battery: cap the frame rate, spend the power budget on consistency"

env:
  WINEMSYNC: 1
  WINEESYNC: 0
  WINEDEBUG: "-all"
  MTL_HUD_ENABLED: 0

game:
  launch_options:
    - -novid
    - -nojoy
    - -console

display:
  width: 1600
  height: 900
  hidpi: false
  fullscreen: 0
  aspect: "16:9"

cvars:
  m_rawinput: 1
  fps_max: 120
  mat_queue_mode: -1

provenance:
  sustained_fps: "T-017 two-hour soak, minute 5 vs minute 90"
  power: "T-017 battery vs plugged, Low Power Mode on/off"
  chassis: "MacBook Air is fanless (preflight WARNs)"

notes: "A capped frame rate is the cheapest way to survive minute 90; minute 5 is marketing."
