# T-006 / T-025 - the bottle recipe. This file is the source of truth: `cs2kit
# bottle create` must reach the CS2 main menu from here alone, with no manual
# step. Every value below is a deliberate deviation from Wine's defaults; if a
# line has no reason next to it, it does not belong in this file.
#
# Corrected 2026-08-24 against the stack actually installed and proven on the
# machine of record (research/wine-dxmt-install-findings-2026-08-24.md): DXMT's
# published release is the *builtin* build, so its DLLs go into the WINE TREE and
# the d3d11/dxgi overrides must stay OFF.
schema: 1
kind: bottle
name: cs2-default
description: "CS2 on Apple Silicon - Sikarugir Wine 10.0 + DXMT v0.80 + MSync (the combination that runs the game)"

wine:
  # Where the Wine build lives. cs2kit derives it from `which wine` when null;
  # set it when you keep several builds side by side.
  root: null
  # MEASURED 2026-08-24, the hard way: DXMT needs a Wine that EXPORTS the
  # winemac.drv API. Gcenx's Wine 11.15 (staging and devel) exports none of it,
  # and CS2 dies with "Failed to create metal view, it seems like your Wine has
  # no exported symbols needed by DXMT". A FOSS CrossOver 24+ build does export
  # it (`nm -g winemac.so | grep macdrv` -> _macdrv_functions) and DXMT then
  # initialises. Staging additionally crashes Steam's Chromium GPU process nine
  # times per launch. See research/steam-black-window-2026-08-24.md.
  # Windows 10 globally: what the Windows Steam client expects.
  windows_version: win10
  # EMPTY ON PURPOSE. DXMT's builtin build ships d3d11/dxgi/d3d10core as Wine
  # builtins, and DXMT's wiki says verbatim "Ensure these dlls are NOT set
  # overrides native,builtin". Marking them native makes Wine hunt for a native
  # DLL in the prefix, find none, and quietly fall back - losing DXMT entirely.
  dll_overrides: {}
  app_defaults:
    cs2.exe:
      # T-009 step 3: documented permanent fix for audio crackling under Wine.
      windows_version: win8
      # OPEN ITEM (research/steam-black-window-2026-08-24.md): DXMT's builtin
      # build applies bottle-wide, and bottle-wide it breaks Steam's own UI -
      # ANGLE cannot query the driver version from DXMT's DXGI adapter and then
      # refuses a GLES 3.0 context. Scoping DXMT to cs2.exe means giving Steam
      # back Wine's original d3d11/dxgi as *native* DLLs in system32 (cs2kit now
      # keeps them: cs2kit bottle restore-wine). Whether Wine will load its own
      # builtin PE as native is UNTESTED - do not write the override until it is.

dxmt:
  # MEASURED 2026-08-24: v0.80 loads and initialises Metal under stock Wine 11.15
  # staging on an M2 Pro. v0.80 is MIT; v0.81 onward is LGPL.
  release: v0.80
  build: builtin
  url: "https://github.com/3Shain/DXMT/releases/download/v0.80/dxmt-v0.80-builtin.tar.gz"
  sha256: "8f260e36b5739e68f3bad613381441385c4dc7b85b78ba8de653d5a6a264529d"
  files:
    - winemetal.so
    - winemetal.dll
    - d3d11.dll
    - dxgi.dll
    - d3d10core.dll
  # winemetal.dll is the one file that belongs in the wine tree AND the prefix.
  prefix_files:
    - winemetal.dll

env:
  WINEMSYNC: 1        # MSync: Apple-native synchronisation primitives
  WINEESYNC: 0        # mutually exclusive with MSync; A/B'd in T-012
  WINEDEBUG: "-all"   # debug channels cost frames
  MTL_HUD_ENABLED: 0  # set to 1 only while benchmarking (T-011)

game:
  appid: 730
  launch_options:
    - -novid
    - -nojoy
    - -console
  # -vulkan is forbidden: DXVK-macOS is frozen at 1.10.3 and CS2 falls back to
  # DX11 silently, so the run measures something other than what it claims.

display:
  width: 1920
  height: 1080
  hidpi: false        # native 3024x1964 costs roughly 4x (T-009 step 4)
  fullscreen: 0       # CS2Video.txt workaround for the black-screen failure mode

steam:
  overlay: false      # costs FPS; revisited in T-016
