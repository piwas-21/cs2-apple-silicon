name: Scheduled security audit
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.8'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked --all-groups --no-build --no-install-project
      - run: uv run --locked --no-sync python scripts/audit_dependencies.py
      - run: uv run --locked --no-sync bandit -c pyproject.toml -r cs2kit -q
      - name: Redacted full-history secret scan
        run: |
          python scripts/install_ci_tools.py gitleaks "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/gitleaks" git --redact --no-banner --exit-code 1
