sonar.projectKey=piwas-21_cs2-apple-silicon
sonar.organization=piwas-21
sonar.projectName=CS2Kit
sonar.sources=cs2kit,scripts,bin,.github,pyproject.toml
sonar.tests=tests
sonar.python.version=3.9
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.sourceEncoding=UTF-8
# Runtime coverage is enforced; hardware research scripts and CI tooling are
# inspected separately and are not installed as part of the Python package.
sonar.coverage.exclusions=scripts/**,bin/**,.github/**
